name: Deploy to Firebase & GCP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: |
          npm install
          npm --prefix functions install
          npm --prefix web install

      - name: Build Web (Frontend para GCP)
        run: npm --prefix web run build
        env:
          # Desliga os emuladores para o build de produção na Google Cloud
          VITE_USE_EMULATORS: "false"
          # Variáveis reais do GCP passadas pelo GitHub Secrets / Variables
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || vars.VITE_FIREBASE_API_KEY || 'AIzaSyAGAXl8FjIrbje3LHVhbkdmaz_i--Q37JI' }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID || vars.VITE_FIREBASE_PROJECT_ID || 'desafio-broadcast-zap' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN || vars.VITE_FIREBASE_AUTH_DOMAIN || 'desafio-broadcast-zap.firebaseapp.com' }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET || vars.VITE_FIREBASE_STORAGE_BUCKET || 'desafio-broadcast-zap.firebasestorage.app' }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID || vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '739193491722' }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID || vars.VITE_FIREBASE_APP_ID || '1:739193491722:web:77582afb6d12c1adb72af3' }}

      - name: Build Functions (Backend para GCP)
        run: npm --prefix functions run build

      - name: Deploy to Firebase & Google Cloud Platform
        uses: w9jds/firebase-action@master
        with:
          args: deploy --project desafio-broadcast-zap --force
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
